<style>
/* Layout: single centered column, one question per screen, thin gold progress line at the top */
:root{
  --bg:#F5F3EF; --surface:#FFFFFF; --ink:#2B3329; --muted:#667063;
  --gold:#A57C2E; --gold-soft:#EBDDBF; --sage:#7F9475; --sage-soft:#E3EADF; --line:#DDD8CC;
  --warn:#9C3B2E; --warn-soft:#F6E1DC;
  --display:'Frank Ruhl Libre','David Libre',Georgia,serif;
  --body:'Assistant','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A16; --surface:#1F251F; --ink:#ECEBE4; --muted:#A3AB9F;
  --gold:#D3AE6A; --gold-soft:#3A3322; --sage:#9DB293; --sage-soft:#26302A; --line:#343C33;
  --warn:#EE9A8B; --warn-soft:#3A2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A16; --surface:#1F251F; --ink:#ECEBE4; --muted:#A3AB9F;
  --gold:#D3AE6A; --gold-soft:#3A3322; --sage:#9DB293; --sage-soft:#26302A; --line:#343C33;
  --warn:#EE9A8B; --warn-soft:#3A2420; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0}
.app{max-width:560px;margin-inline:auto;min-height:100vh;display:flex;flex-direction:column;padding-block:16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-family:var(--display);font-weight:700;color:var(--gold);font-size:16px;display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.brand img{border-radius:50%;display:block}
.logo{width:min(220px,58vw);height:auto;border-radius:50%;display:block;margin-inline:auto}
.hero{text-align:center;align-items:center}
.hero .lead{margin-inline:auto}
.hero .row{justify-content:center;flex-direction:column;width:100%;max-width:340px}
.hero .btn{width:100%}
.hero .disc{text-align:center}
.ico{display:inline-flex;flex:none;width:36px;height:36px;border-radius:10px;background:var(--sage-soft);color:var(--sage);align-items:center;justify-content:center}
.ico svg{width:21px;height:21px}
.card .hd{display:flex;align-items:center;gap:12px}
.main .ico{background:var(--gold-soft);color:var(--gold)}
ul.chk li .ico{width:32px;height:32px;align-self:flex-start}
.app{direction:rtl;text-align:right}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.ovbar strong{font-family:var(--display);font-size:17px;min-width:0}
.ovbtns{display:flex;gap:8px;flex:none}
.ovbody{flex:1;overflow:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.ovpages{display:flex;flex-direction:column;gap:12px;width:100%;max-width:900px;margin-inline:auto}
.ovpages.big{width:230%;max-width:none;margin-inline:0}
.ovpages img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.sharerow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sbtn{font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:10px 12px;min-height:44px;text-decoration:none;border-radius:8px}
.sbtn:hover{color:var(--ink)}
.sbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sbtn svg{width:18px;height:18px}
.btn.sm{min-height:44px;padding:10px 18px;font-size:15px}
.card.doc{display:flex;gap:14px;align-items:flex-start}
.card.doc .dtx{flex:1;min-width:0}
.card.doc h3{font-size:18px}
.th{flex:none;width:72px;height:72px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid var(--line);background:var(--sage-soft)}
.th.pdf{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--gold);letter-spacing:.06em}
.dmsg{font-size:14px!important;color:var(--sage)!important}
@media (max-width:420px){.card.doc{flex-direction:column}}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:8px 4px;min-height:44px}
.back:hover{color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-block:4px 0}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s ease}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:32px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}.bar i{transition:none}}
h1,h2{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,7vw,38px);font-weight:900}
h2{font-size:clamp(23px,5.5vw,30px);font-weight:700}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--sage);font-weight:700;margin-bottom:10px}
.lead{color:var(--muted);margin:12px 0 0;max-width:46ch}
.hint{color:var(--muted);font-size:15px;margin:8px 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.opt{font:inherit;text-align:start;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:15px 18px;cursor:pointer;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible,input:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:15px 24px;cursor:pointer;min-height:54px;background:var(--gold);color:#fff;text-align:center;text-decoration:none;display:inline-block}
:root[data-theme="dark"] .btn,.dk .btn{color:#1a1a14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#1a1a14}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sage{background:var(--sage);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sage{color:#14181A}}
:root[data-theme="dark"] .btn.sage{color:#14181A}
.field{display:flex;align-items:center;gap:10px;margin-top:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding-inline:16px}
.field:focus-within{border-color:var(--gold)}
.field input{flex:1;min-width:0;font:inherit;font-size:24px;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);padding-block:14px;direction:ltr;text-align:right}
.field input:focus-visible{outline:none}
.field span{color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.disc{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.link{color:var(--gold);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.main{border-color:var(--gold);border-width:1.5px}
.card h3{margin:0;font-family:var(--display);font-size:20px}
.card .amt{font-family:var(--display);font-weight:900;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.card .amt small{font-size:15px;font-weight:500;color:var(--muted)}
.card p{margin:8px 0 0;color:var(--muted);font-size:15px}
.join{align-self:center;text-align:center;font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--sage)}
.join small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.04em;margin-top:4px}
.note{background:var(--sage-soft);border-radius:10px;padding:14px 16px;font-size:15px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:14px 16px;font-weight:600;font-size:15px}
.sub{font-family:var(--display);font-size:19px;font-weight:700;margin:28px 0 -4px}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.chk li{display:flex;gap:12px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px}
ul.chk li b{color:var(--sage);flex:none;min-width:1.2em}
ul.chk li.off b{color:var(--muted)}
ul.chk li.off{color:var(--muted)}
ul.chk li em{font-style:normal;color:var(--gold);font-weight:700;white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.split{grid-template-columns:1fr}}
</style>

</head>
